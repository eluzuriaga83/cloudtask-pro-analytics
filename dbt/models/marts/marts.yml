version: 2

models:
  - name: dim_customers
    description: "Customer dimension"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      
      - name: plan
        tests:
          - accepted_values:
              arguments:
                values: ['Starter', 'Professional', 'Business', 'Enterprise']
      - name: churned
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

      - name: churn_date
        tests:
          - not_null:
              config:
                where: "churned = 1"

      - name: customer_lifetime_value
        tests:
          - not_null
      
      - name: risk_level
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Very High Risk', 'High Risk', 'Medium Risk', 'Low Risk']
      
      - name: customer_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Churned']

  
  - name: fct_monthly_metrics
    description: "Monthly metrics"
    columns:
      - name: date
        tests:
          - unique
          - not_null
      
      - name: total_active_customers
        tests:
          - not_null
      
      - name: new_customers
        tests:
          - not_null
      
      - name: churned_customers
        tests:
          - not_null
      
      - name: monthly_churn_rate_pct
        tests:
          - not_null
      
      - name: total_mrr
        tests:
          - not_null
      
      - name: avg_revenue_per_customer
        tests:
          - not_null
      
      - name: customer_acquisition_cost
        tests:
          - not_null
      
      - name: mrr_per_active_customer
        tests:
          - not_null
      
      - name: monthly_cac_spend
        tests:
          - not_null
      
      - name: mrr_growth_rate_pct
        tests:
          - not_null
      
      - name: new_customer_growth_rate_pct
        tests:
          - not_null